# Routes of the workflow (workflow-service.yaml). This file belongs to the owner of the workflow.
# Starting owner onboarding is a sign-up, so it passes without a token (DEC-WF-01); reading a
# saga needs one. The workflow validates the token itself; /internal/ is never routed.

# Exact location: a sign-up is a target for abuse, so the burst is as tight as login's.
location = /api/v1/sagas/owner-onboarding {
    if ($request_method = OPTIONS) { return 204; }
    default_type application/json;
    limit_req zone=per_client burst=5 nodelay;
    # A variable forces per-request resolution (see 00-resolver.conf).
    set $workflow http://workflow:8080;
    proxy_pass $workflow;
}

# GET /api/v1/sagas/{id}.
location /api/v1/sagas/ {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $workflow http://workflow:8080;
    proxy_pass $workflow;
}
