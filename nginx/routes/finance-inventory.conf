# Routes of the finance-inventory domain (finance-inventory-service.yaml). This file belongs to the
# owner of finance-inventory. Nothing here is anonymous: the tenant and the user come from the token.
# barber-saas-finance-inventory-api validates the token itself; this only filters requests that carry none.
# The service has no /internal routes, and none is ever routed here.

# Income, expenses and the period summary: /records, /records/{id}, /summary.
location /api/v1/finance/ {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $finance_inventory_api http://finance-inventory-api:8080;
    proxy_pass $finance_inventory_api;
}

# Products and their stock movements: /products, /products/{id}, /products/{id}/movements.
location /api/v1/inventory/ {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $finance_inventory_api http://finance-inventory-api:8080;
    proxy_pass $finance_inventory_api;
}
