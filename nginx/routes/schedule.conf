# Routes of the schedule domain (schedule-service.yaml). This file belongs to the owner of schedule.
# Nothing here is anonymous: availability needs a token because the tenant comes from it.
# barber-saas-schedule-api validates the token itself; this only filters requests that carry none.

location /api/v1/barber-schedules/ {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $schedule_api http://schedule-api:8080;
    proxy_pass $schedule_api;
}

location = /api/v1/schedule-exceptions {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $schedule_api http://schedule-api:8080;
    proxy_pass $schedule_api;
}

location /api/v1/schedule-exceptions/ {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $schedule_api http://schedule-api:8080;
    proxy_pass $schedule_api;
}

# The booking screen asks this often while the client moves between dates: a wider burst.
location = /api/v1/availability {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=40 nodelay;
    set $schedule_api http://schedule-api:8080;
    proxy_pass $schedule_api;
}
