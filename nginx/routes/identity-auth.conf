# Routes of the identity-auth domain (auth-service.yaml). This file belongs to the owner of
# identity-auth. Register, login, refresh, password reset and the JWKS are how a client obtains
# a token, so they pass without one; logout needs it.
location = /api/v1/auth/logout {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $identity_auth_api http://identity-auth-api:8080;
    proxy_pass $identity_auth_api;
}

location /api/v1/auth/ {
    if ($request_method = OPTIONS) { return 204; }
    default_type application/json;
    # Login and registration are the target of credential stuffing: a tighter burst.
    limit_req zone=per_client burst=5 nodelay;
    # A variable forces per-request resolution (see 00-resolver.conf).
    set $identity_auth_api http://identity-auth-api:8080;
    proxy_pass $identity_auth_api;
}
