# Routes of the appointment domain (appointment-service.yaml). This file belongs to the owner of
# appointment. Only the reviews list is anonymous (DEC-APPT-11): everywhere else the tenant and the
# user come from the token. barber-saas-appointment-api validates the token itself; this only filters
# requests that carry none.

# Anonymous: GET /api/v1/reviews?barbershopId=&barberId= (public discovery data, like the catalog of
# barbershop). Exact location, so nothing else under /api/v1/reviews is routed here.
location = /api/v1/reviews {
    if ($request_method = OPTIONS) { return 204; }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $appointment_api http://appointment-api:8080;
    proxy_pass $appointment_api;
}

# GET (list) and POST (book, with Idempotency-Key) on the collection. Exact location, so
# /api/v1/appointmentsX is not routed here.
location = /api/v1/appointments {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $appointment_api http://appointment-api:8080;
    proxy_pass $appointment_api;
}

# One appointment and its transitions: /{id}, /{id}/confirm, /start, /complete, /cancel, /no-show.
location /api/v1/appointments/ {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $appointment_api http://appointment-api:8080;
    proxy_pass $appointment_api;
}
