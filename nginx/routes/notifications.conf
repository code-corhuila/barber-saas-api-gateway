# Routes of the notifications domain (notification-service.yaml 2.1.0). This file belongs to the owner
# of notifications. Every route needs a token: each user reads and marks only their own inbox, and
# registers their own device. barber-saas-notifications-api validates the token itself; this only
# filters requests that carry none. /internal/v1/events (the worker) is never routed here.

# Protected: GET /api/v1/notifications. Exact and "/" locations, so /api/v1/notificationsX is not routed.
location = /api/v1/notifications {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $notifications_api http://notifications-api:8080;
    proxy_pass $notifications_api;
}

# Protected: POST /api/v1/notifications/{id}/read
location /api/v1/notifications/ {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $notifications_api http://notifications-api:8080;
    proxy_pass $notifications_api;
}

# Protected: POST /api/v1/device-tokens (with Idempotency-Key)
location = /api/v1/device-tokens {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $notifications_api http://notifications-api:8080;
    proxy_pass $notifications_api;
}
