# Routes of the barbershop domain (barbershop-service.yaml). This file belongs to the owner of
# barbershop. The discovery catalog is anonymous (DEC-SHOP-02): the search, a barbershop by id and
# its services and barbers pass without a token. Everything else needs one. barber-saas-barbershop-api
# validates the token itself; this only filters requests that carry none.

# Anonymous: GET /api/v1/barbershops?city=&lat=&lng=
location = /api/v1/barbershops {
    if ($request_method = OPTIONS) { return 204; }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $barbershop_api http://barbershop-api:8080;
    proxy_pass $barbershop_api;
}

# Anonymous: GET /api/v1/barbershops/{id}, /{id}/services and /{id}/barbers. Only a UUID is public, so
# /api/v1/barbershops/me falls through to the protected location below.
location ~ "^/api/v1/barbershops/[0-9a-fA-F-]{36}(/services|/barbers)?$" {
    if ($request_method = OPTIONS) { return 204; }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $barbershop_api http://barbershop-api:8080;
    proxy_pass $barbershop_api;
}

# Protected: /api/v1/barbershops/me
location /api/v1/barbershops/ {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $barbershop_api http://barbershop-api:8080;
    proxy_pass $barbershop_api;
}

# Protected: the service catalog of the token's barbershop. Exact and "/" locations, so /api/v1/servicesX
# is not routed here.
location = /api/v1/services {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $barbershop_api http://barbershop-api:8080;
    proxy_pass $barbershop_api;
}

location /api/v1/services/ {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $barbershop_api http://barbershop-api:8080;
    proxy_pass $barbershop_api;
}

# Protected: barber profiles and their specialties. "/api/v1/barbers" is a prefix of "/api/v1/barbershops",
# hence the exact location and the one ending in "/".
location = /api/v1/barbers {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $barbershop_api http://barbershop-api:8080;
    proxy_pass $barbershop_api;
}

location /api/v1/barbers/ {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $barbershop_api http://barbershop-api:8080;
    proxy_pass $barbershop_api;
}
