# Routes of the platform-admin domain (platform-admin-service.yaml). This file belongs to the owner of
# platform-admin. The active plans are anonymous (self-registration, FR-004); everything under
# /api/v1/platform/ needs a token. barber-saas-platform-admin-api validates the token itself and allows
# only SUPER_ADMIN there; this only filters requests that carry none. /internal/ is never routed.

# Anonymous: GET /api/v1/plans. Exact location, so /api/v1/plansX is not routed here.
location = /api/v1/plans {
    if ($request_method = OPTIONS) { return 204; }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $platform_admin_api http://platform-admin-api:8080;
    proxy_pass $platform_admin_api;
}

# Protected: plans and barbershops of the platform (SUPER_ADMIN).
location /api/v1/platform/ {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $platform_admin_api http://platform-admin-api:8080;
    proxy_pass $platform_admin_api;
}
