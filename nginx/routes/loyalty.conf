# Routes of the loyalty domain (loyalty-service.yaml). This file belongs to the owner of loyalty.
# Nothing here is anonymous: the tenant and the user come from the token.
# barber-saas-loyalty-api validates the token itself; this only filters requests that carry none.
# Its /internal routes (events and the outbox relay) are for the worker and are never routed here.

# The rule, the cards and their history, stickers, redemptions and coupons.
location /api/v1/loyalty/ {
    if ($request_method = OPTIONS) { return 204; }
    if ($missing_auth) {
        return 401 '{"error":"UNAUTHORIZED","message":"a bearer token is required","traceId":"$correlation_id"}';
    }
    default_type application/json;
    limit_req zone=per_client burst=20 nodelay;
    set $loyalty_api http://loyalty-api:8080;
    proxy_pass $loyalty_api;
}
