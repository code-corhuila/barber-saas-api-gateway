# The real client behind Caddy (ADR-019, compose.public.yml). On the public host every request
# reaches the gateway from Caddy's container, so without this the rate limit of 10-security.conf
# would count the whole internet as one client and the access log would show Caddy's address.
# Caddy sets X-Forwarded-For to the address it saw and drops the one a client sends, so only a
# proxy on a Docker network is trusted to name the client. The gateway's 8000 is never published
# on the public host: nothing outside these networks can reach it to forge the header.
set_real_ip_from 172.16.0.0/12;     # Docker's default bridge networks
set_real_ip_from 192.168.0.0/16;    # Docker's next address pool and Docker Desktop
real_ip_header X-Forwarded-For;
real_ip_recursive on;
