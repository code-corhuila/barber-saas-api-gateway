worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # $request_time is in seconds with three decimals; the log field is whole milliseconds (OBS-01).
    # volatile: the map must read the time at log time, not reuse an earlier value.
    map $request_time $duration_ms {
        volatile;
        default                       0;
        "~^0\.0*([1-9][0-9]*)$"       $1;
        "~^([1-9][0-9]*)\.([0-9]{3})$" $1$2;
    }

    # Structured access log: one JSON object per request, with a correlation id and the real client
    # (05-real-ip.conf).
    log_format json escape=json '{"time":"$time_iso8601","correlationId":"$correlation_id","client":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"upstream":"$upstream_addr","durationMs":$duration_ms}';
    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    server_tokens off;
    client_max_body_size 2m;

    include /etc/nginx/conf.d/*.conf;
}
