# This service only. barber-saas-infra-postgres includes this file to compose the platform.
# The gateway is the only container published to the host (norm 5.6.1).
services:
  api-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 128m
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
